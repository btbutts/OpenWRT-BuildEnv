# Prevent default overwrites when reloading via configfile
if [ -z "$installer_capture_log" ]; then
    set installer_capture_log="0"
fi
export installer_capture_log

set default="deploy_openwrt"
set timeout=15

set translation_filter_mode=1
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod serial
insmod efi_gop
insmod all_video

terminal_output console
set gfxpayload=text

# Console is quiet unless toggled on
set installer_cmdline="console=tty1 fbcon=deferred"

# GPU Blacklist Option
set gpu_blacklist="modprobe.blacklist=amdgpu,i915"

# Installer Log Options
set capture_installer_log="loglevel=7 installer.log=1"
set def_loglevel="loglevel=3"

if [ "$installer_capture_log" = "1" ]; then
    set log_menu_title="Disable USB boot-log capture (currently ON)"
else
    set log_menu_title="Enable USB boot-log capture (currently OFF)"
fi

# Toggle USB boot-log capture
menuentry "$log_menu_title" --id toggle-log {
    if [ "$installer_capture_log" = "1" ]; then
        set installer_capture_log="0"
    else
        set installer_capture_log="1"
    fi
    export installer_capture_log
    echo "Startup log is stored for this GRUB session only!"
    echo "It is not written to the boot media until Buildroot userspace starts."
    echo "Reloading runtime bootloader engine..."
    sleep --interruptible 3
    configfile $prefix/grub.cfg
}

menuentry "Execute Bare-Metal OpenWRT Deployment Engine" --id deploy_openwrt --class linux {
    echo "Loading customized system installer kernel..."
    search --no-floppy --file --set=root /boot/vmlinuz-installer
    if [ "$installer_capture_log" = "1" ]; then
        linux /boot/vmlinuz-installer ${installer_cmdline} ${capture_installer_log}
    else
        linux /boot/vmlinuz-installer ${installer_cmdline} ${def_loglevel}
    fi
    echo "Loading ramdisk..."
    initrd /boot/initramfs-installer.img
}

menuentry "Emergency Hardware Maintenance Shell" --class shell {
    echo "Loading kernel in diagnostic maintenance framework mode..."
    search --no-floppy --file --set=root /boot/vmlinuz-installer
    if [ "$installer_capture_log" = "1" ]; then
        linux /boot/vmlinuz-installer ${installer_cmdline} ${capture_installer_log} single
    else
        linux /boot/vmlinuz-installer ${installer_cmdline} ${def_loglevel} single
    fi
    echo "Loading ramdisk..."
    initrd /boot/initramfs-installer.img
}

menuentry "Execute Bare-Metal OpenWRT Deployment Engine (GPU Blacklist)" --class linux {
    echo "Loading customized system installer kernel..."
    search --no-floppy --file --set=root /boot/vmlinuz-installer
    if [ "$installer_capture_log" = "1" ]; then
        linux /boot/vmlinuz-installer ${installer_cmdline} ${capture_installer_log} ${gpu_blacklist}
    else
        linux /boot/vmlinuz-installer ${installer_cmdline} ${def_loglevel} ${gpu_blacklist}
    fi
    echo "Loading ramdisk..."
    initrd /boot/initramfs-installer.img
}

menuentry "Emergency Hardware Maintenance Shell (GPU Blacklist)" --class shell {
    echo "Loading kernel in diagnostic maintenance framework mode..."
    search --no-floppy --file --set=root /boot/vmlinuz-installer
    if [ "$installer_capture_log" = "1" ]; then
        linux /boot/vmlinuz-installer ${installer_cmdline} ${capture_installer_log} ${gpu_blacklist} single
    else
        linux /boot/vmlinuz-installer ${installer_cmdline} ${def_loglevel} ${gpu_blacklist} single
    fi
    echo "Loading ramdisk..."
    initrd /boot/initramfs-installer.img
}
