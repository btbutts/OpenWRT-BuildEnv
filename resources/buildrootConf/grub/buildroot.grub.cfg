insmod test
insmod tr

# Survive configfile reloads of this file (submenu toggles).
if [ -z "$installer_capture_log" ]; then
    set installer_capture_log="0"
fi
if [ -z "$installer_gpu_blacklist" ]; then
    set installer_gpu_blacklist="0"
fi
export installer_capture_log
export installer_gpu_blacklist

set default="deploy_openwrt"
set timeout=15
set timeout_style=menu

set translation_filter_mode=1
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod serial
insmod efi_gop
insmod all_video

terminal_output console
set gfxpayload=text

# Shared kernel args. loglevel lives only in log_opts; GPU blacklist in gpu_opts.
set installer_cmdline="console=tty1 fbcon=deferred"

if [ "$installer_capture_log" = "1" ]; then
    set log_opts="loglevel=7 installer.log=1"
    set log_state="ON"
    set log_menu_title="Disable USB boot-log capture (currently ON)"
else
    set log_opts="loglevel=3"
    set log_state="OFF"
    set log_menu_title="Enable USB boot-log capture (currently OFF)"
fi
export log_opts log_state log_menu_title

if [ "$installer_gpu_blacklist" = "1" ]; then
    set gpu_opts="modprobe.blacklist=amdgpu,i915"
    set gpu_state="ON"
    set gpu_menu_title="Disable GPU blacklist (currently ON)"
else
    set gpu_opts=""
    set gpu_state="OFF"
    set gpu_menu_title="Enable GPU blacklist (currently OFF)"
fi
export gpu_opts gpu_state gpu_menu_title

submenu "Session boot options (log capture: ${log_state}, GPU blacklist: ${gpu_state})" --id boot-options {
    menuentry "$log_menu_title" --id toggle-log {
        if [ "$installer_capture_log" = "1" ]; then
            set installer_capture_log="0"
        else
            set installer_capture_log="1"
        fi
        export installer_capture_log
        echo "USB boot-log capture is stored for this GRUB session only!"
        echo "It is not written to the boot media until Buildroot userspace starts."
        echo "Reloading runtime bootloader engine..."
        sleep --interruptible 2
        configfile ${prefix}/grub.cfg
    }

    menuentry "$gpu_menu_title" --id toggle-gpu {
        if [ "$installer_gpu_blacklist" = "1" ]; then
            set installer_gpu_blacklist="0"
        else
            set installer_gpu_blacklist="1"
        fi
        export installer_gpu_blacklist
        echo "GPU blacklist is stored for this GRUB session only!"
        echo "Reloading runtime bootloader engine..."
        sleep --interruptible 2
        configfile ${prefix}/grub.cfg
    }
}

menuentry "Execute Bare-Metal OpenWRT Deployment Engine" --id deploy_openwrt --class linux {
    echo "Loading customized system installer kernel..."
    search --no-floppy --file --set=root /boot/vmlinuz-installer
    linux /boot/vmlinuz-installer ${installer_cmdline} ${log_opts} ${gpu_opts}
    echo "Loading ramdisk..."
    initrd /boot/initramfs-installer.img
}

menuentry "Emergency Hardware Maintenance Shell" --class shell {
    echo "Loading kernel in diagnostic maintenance framework mode..."
    search --no-floppy --file --set=root /boot/vmlinuz-installer
    linux /boot/vmlinuz-installer ${installer_cmdline} ${log_opts} ${gpu_opts} installer.mode=shell
    echo "Loading ramdisk..."
    initrd /boot/initramfs-installer.img
}

menuentry "Emergency Hardware Recovery Shell (emergency.target)" --class shell {
    echo "Loading kernel in systemd emergency mode (minimal userspace, no installer wizard)..."
    search --no-floppy --file --set=root /boot/vmlinuz-installer
    linux /boot/vmlinuz-installer ${installer_cmdline} ${log_opts} ${gpu_opts} systemd.unit=emergency.target
    echo "Loading ramdisk..."
    initrd /boot/initramfs-installer.img
}
