[Unit]
After=installer-wizard.service
# console-session.sh waits for the display driver udev loads at coldplug, and
# pam_systemd (PAMName below) talks to logind.
After=systemd-udev-trigger.service systemd-logind.service
# wizard <-> root shell loop: never trip the default start limit.
StartLimitIntervalSec=0

[Service]
# USB installer: no password. agetty --autologin passes login -f root
# (preauthenticated). Empty BR2_TARGET_GENERIC_ROOT_PASSWD plus PAM
# without nullok otherwise yields "Login incorrect" for root.
#
# console-session.sh runs that same login inside kmscon when a real display
# driver has a connected output, and runs the agetty command line that used to
# be here otherwise or when kmscon fails (it keeps the leading "-" semantics of
# this ExecStart: its exit status is ignored).
ExecStart=
ExecStart=-/usr/lib/installer/console-session.sh shell
# A logind session for kmscon --libseat (see /etc/pam.d/installer-console).
# User= is what makes PAMName= take effect. The getty path logs in through
# /etc/pam.d/login, which reuses this session.
User=root
PAMName=installer-console
# The upstream unit uses /dev/console, and systemd hands PAM that name
# ("console"): logind then makes a session on seat0 with VT number 0, so no
# XDG_VTNR and no libseat. This image always boots console=tty1 (GRUB), so name
# the VT; that is the same device. console-session.sh passes agetty the kernel
# console explicitly when it is not a VT (console=ttyS0), so serial logins
# still follow console=.
TTYPath=/dev/tty1
# systemd no longer respawns the shell by itself. When it ends,
# shell-exit.sh decides: `exit` typed by the operator -> installer-wizard.service
# again; VT hangup / amdgpu-fbcon takeover / maintenance boot entries ->
# a fresh getty on whatever kernel console= currently is.
Restart=no
ExecStartPre=-/usr/lib/installer/shell-exit.sh stamp
# Also covers installer.mode=shell, where the wizard unit never runs.
ExecStartPre=-/usr/lib/installer/quiet-console.sh
ExecStopPost=-/usr/lib/installer/shell-exit.sh
