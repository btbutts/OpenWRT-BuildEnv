[Unit]
After=installer-wizard.service

[Service]
# USB installer: no password. agetty --autologin passes login -f root
# (preauthenticated). Empty BR2_TARGET_GENERIC_ROOT_PASSWD plus PAM
# without nullok otherwise yields "Login incorrect" for root.
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud - 115200,38400,9600 $TERM
# amdgpu/fbcon takeover can clear the VT after an early prompt.
# Restart reprints the shell on whatever kernel console= currently is.
Restart=always
RestartSec=1
