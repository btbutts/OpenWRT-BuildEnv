# Read by systemd-vconsole-setup.service at boot, and again by udev whenever a
# new virtual console appears (e.g. the GPU driver taking over fbcon), so the
# font survives that handover.
#
# The kernel's built-in font is 8x16. LatArCyrHeb-19 is the next size up (8x19,
# same width, 3 rows taller) and keeps the box-drawing glyphs the TUI needs.
# The next steps are LatGrkCyr-12x22 / sun12x22 (12x22), then latarcyrheb-sun32
# (16x32). Preview them with /root/show-fonts.sh.
KEYMAP=us
FONT=LatArCyrHeb-19
