## kmscon configuration of the installer image (read from /etc/kmscon/kmscon.conf).
##
## The command line wins over this file. The installer launcher
## (/usr/lib/installer/console-session.sh) starts kmscon with --vt, --oneshot,
## --no-reset-env, -l and, when a logind session exists, --libseat, so those are not set
## here. A boolean is switched off by a "no-" prefix (no-drm). A "#" starts a comment.
##
## The complete list of options is in /etc/kmscon/kmscon.conf.example.

### General
## Log what kmscon does (the journal of the installer-wizard / console-getty unit)
verbose

### Graphics
## Draw with the DRM driver (the default; set here so that it is explicit)
drm
## Use every GPU. [all, primary, aux]
gpus=all
## No "mode": the monitors' own (preferred) resolution is used, the way kmscon picks it.
## No "hwaccel": the software renderer is enough for a text console and needs no GL stack.

### Fonts
## Pixel height of the font. 0 would choose from the monitor's resolution.
font-size=22
## A fontconfig family list, the one wanted most first. A character is drawn by the first
## font in the list that has it, so the later families fill in what the earlier ones lack
## (check marks, the warning sign, icons); the first one installed also sets the size of the
## cell. The first four are installed by BR2_PACKAGE_HIGH_RES_FONT_PACK; without that package
## they are skipped and DejaVu Sans Mono (BR2_PACKAGE_DEJAVU_MONO) is used, as it was before.
## Only Regular and Bold are installed of each. A family name may not contain a "-" here.
font-name=Source Code Pro,Inconsolata Nerd Font Mono,FiraMono Nerd Font Mono,JetBrains Mono,DejaVu Sans Mono

### Keyboard
## kmscon puts its console in K_OFF mode, so the kernel never sees the keys and its own
## Ctrl+Alt+Del handling is not reached; kmscon has to do it. With the kernel's
## /proc/sys/kernel/ctrl-alt-del at 0 (the default) kmscon signals PID 1 (SIGINT), which
## systemd turns into ctrl-alt-del.target: a graceful reboot, exactly as on a plain VT.
grab-reboot=<Ctrl><Alt>Delete
## The layout of the installer's keyboard (US when left alone)
#xkb-layout=us

### Other
## Screen blanking after this many seconds without input (0 = never). The default is 600.
dpms-timeout=0
